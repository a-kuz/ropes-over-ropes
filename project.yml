name: UzlsFour
options:
  developmentLanguage: en
  generateEmptyDirectories: true
settings:
  base:
    SDKROOT: auto
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      GCC_OPTIMIZATION_LEVEL: s
      SWIFT_COMPILATION_MODE: wholemodule
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
targets:
  UzlsFour:
    type: application
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: App
      - path: Game
      - path: Shaders
    settings:
      base:
        DEVELOPMENT_TEAM: NW2CSMF97Y
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.uzls.four
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphoneos*]": YES
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphonesimulator*]": YES
        "INFOPLIST_KEY_UIStatusBarHidden[sdk=iphoneos*]": YES
        "INFOPLIST_KEY_UIStatusBarHidden[sdk=iphonesimulator*]": YES
        "INFOPLIST_KEY_UIRequiresFullScreen[sdk=iphoneos*]": NO
        "INFOPLIST_KEY_UIRequiresFullScreen[sdk=iphonesimulator*]": NO
        "INFOPLIST_KEY_UIInterfaceOrientation[sdk=iphoneos*]": UIInterfaceOrientationPortrait
        "INFOPLIST_KEY_UIInterfaceOrientation[sdk=iphonesimulator*]": UIInterfaceOrientationPortrait
        "INFOPLIST_KEY_UISupportedInterfaceOrientations[sdk=iphoneos*]": "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        "INFOPLIST_KEY_UISupportedInterfaceOrientations[sdk=iphonesimulator*]": "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad[sdk=iphoneos*]": "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad[sdk=iphonesimulator*]": "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        "INFOPLIST_KEY_CADisableMinimumFrameDuration[sdk=iphoneos*]": YES
        "INFOPLIST_KEY_CADisableMinimumFrameDuration[sdk=iphonesimulator*]": YES
        "TARGETED_DEVICE_FAMILY[sdk=iphoneos*]": "1,2"
        "TARGETED_DEVICE_FAMILY[sdk=iphonesimulator*]": "1,2"
        UIFileSharingEnabled: YES
        LSSupportsOpeningDocumentsInPlace: YES
  UzlsFourTests:
    type: bundle.unit-test
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: Tests
    dependencies:
      - target: UzlsFour_${platform}
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
schemes:
  UzlsFour_iOS:
    build:
      targets:
        UzlsFour_iOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UzlsFourTests_iOS
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  UzlsFour_macOS:
    build:
      targets:
        UzlsFour_macOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UzlsFourTests_macOS
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
