name: UzlsFour
options:
  developmentLanguage: en
  generateEmptyDirectories: true
settings:
  base:
    SDKROOT: auto
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      GCC_OPTIMIZATION_LEVEL: s
      SWIFT_COMPILATION_MODE: wholemodule
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
targets:
  UzlsFour26:
    type: application
    platform: iOS
    deploymentTarget:
      iOS: "26.0"
    sources:
      - path: App
      - path: Game
      - path: Shaders
    settings:
      base:
        DEVELOPMENT_TEAM: NW2CSMF97Y
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.uzls.four
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        PRODUCT_MODULE_NAME: UzlsFour
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UIInterfaceOrientation: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CADisableMinimumFrameDuration: YES
        INFOPLIST_KEY_CADisableMinimumFrameDurationOnPhone: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        UIFileSharingEnabled: YES
        LSSupportsOpeningDocumentsInPlace: YES
  UzlsFourTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget:
      iOS: "26.0"
    sources:
      - path: Tests
      - path: Game
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""
schemes:
  UzlsFour26:
    build:
      targets:
        UzlsFour26: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UzlsFourTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
