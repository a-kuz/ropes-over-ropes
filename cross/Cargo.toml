[package]
name = "uzls-cross"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "uzls"
path = "src/main.rs"

[dependencies]
wgpu = "24"
winit = "0.30"
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
raw-window-handle = "0.6"
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = { version = "0.31", default-features = false, features = ["links"] }
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
env_logger = "0.11"
dirs = "6"
rodio = { version = "0.22.1", default-features = false, features = ["playback"] }
arboard = "3"
ureq = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Document", "Window", "Element", "HtmlCanvasElement",
    "Event", "MouseEvent", "TouchEvent", "TouchList", "Touch",
    "KeyboardEvent", "Storage",
    "AudioContext", "AudioContextState", "AudioBuffer", "AudioBufferSourceNode",
    "AudioDestinationNode", "GainNode", "GainOptions",
    "Request", "RequestInit", "RequestMode", "Response", "Headers",
] }
js-sys = "0.3"
console_log = "1"
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"

[profile.release]
opt-level = 3
lto = true
